[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomicreglm"
version = "0.1.0"
description = "Multimodal DNA+chromatin gene expression prediction toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "pyyaml",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
